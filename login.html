<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Developer Portal</title>
    <link rel="stylesheet" href="login.css">
    <!-- <script type="module" src="orderservice.js"></script>
    <script type="module" src="authservice.js"></script> -->
    <script type="module" src="firebaseauth.js" defer></script>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please sign in to access your dashboard</p>
        </div>
        
        <div class="login-body">
            <div class="input-group">
                <label for="userId">User ID</label>
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <input type="text" id="userId" placeholder="Please enter your User ID">
                </div>
                <div id="userIdFeedback" class="input-feedback"></div>
            </div>
            
            <button onclick="login()" id="loginButton">
                <div class="btn-content">
                    <div class="loading-spinner"></div>
                    <span class="btn-text">Login</span>
                </div>
            </button>
            <br><br>
            <button onclick="loginWithGoogle()" id="loginButtonWithGoogle">
                <div class="btn-content">
                    <div class="loading-spinner"></div>
                    <span class="btn-text"> 🎯 Login With Google</span>
                </div>
            </button>

            <div class="registration-option">
                <span>Do you not possess an account?</span> 
                <a href="#" class="registration-link" onclick="showCreateAccountModal()">Create one</a>
            </div>
        </div>
        
        <div class="login-footer">
            <p class="help-text">Securely access your dashboard using your User ID</p>
            <div class="links">
                <a href="#">Help</a>
                <a href="#">Privacy Policy</a>
            </div>
        </div>
    </div>
    
    <!-- Toast Notifications -->
    <div id="toast" class="toast">
        <div id="toastIcon" class="toast-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <div class="toast-content">
            <div class="toast-title" id="toastTitle">Notification</div>
            <div class="toast-message" id="toastMessage">This is a notification message.</div>
        </div>
    </div>

    <!-- Create Account Modal -->

                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="newUserId">User ID</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <input type="text" id="newUserId" placeholder="Select a User ID" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <input type="email" id="email" placeholder="Please enter your email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.7 16.3l-2.4-2.4a1 1 0 0 0-1.4 0l-1 1a11.17 11.17 0 0 1-7-7l1-1a1 1 0 0 0 0-1.4l-2.4-2.4a1 1 0 0 0-1.4 0l-1 1A14.96 14.96 0 0 0 0 12c0 2.5 1.2 4.8 3.1 6.3 1 .7 2.2.7 3.1 0L6 17.1c1 .7 2.2.7 3.1 0 2-.7 3.3-1.6 4.1-2.5 1.7 1.3 3.6 2.1 5.8 2.1h0a1 1 0 0 0 .7-.3l1-1a1 1 0 0 0-.1-1.4z"></path>
                            </svg>
                        </div>
                        <input type="tel" id="phone" placeholder="Please enter your phone number" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="address">Address</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 6.5V19c0 .55-.45 1-1 1H2a1 1 0 0 1-1-1V6.5c0-.55.45-1 1-1h16c.55 0 1 .45 1 1z"></path>
                                <path d="M20.29 3.29L14 9.58V8a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v1.58l-6.29-6.29A1 1 0 0 1 2.29.29l18 18a1 1 0 1 1-1.42 1.42l-7-7a1 1 0 0 1 0-1.42l7-7a1 1 0 0 1 1.42 1.42z"></path>
                            </svg>
                        </div>
                        <input type="text" id="address" placeholder="Please enter your address" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="button-secondary" onclick="hideCreateAccountModal()">Cancel</button>
                <button onclick="createAccount()" id="createAccountButton">Create Account</button>
            </div>
    </div>

// Function to register a new user
function registerUser(id, email , Phone, address) {
    // Check if user ID or email already exists in the database
    const userExists = userDatabase.some(user => user.id === id || user.email === email || user.phone === phone || user.address === address);
    
    if (userExists) {
        console.error("Error: User ID or Email already exists.");
        return;
    }
    
    // Create a new user object
    const newUser = {
        id: id,
        email: email,
        phone: Phone,
        address: address,
        lastLogin: new Date().toISOString() // Set lastLogin to the current date and time
    };
    
    // Add new user to the database
    userDatabase.push(newUser);
    console.log("User registered successfully:", newUser);
}

        function showToast(type, title, message) {
            const toast = document.getElementById("toast");
            const toastTitle = document.getElementById("toastTitle");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");
            
            // Conceal any visible toast first
            toast.classList.remove("show", "error", "success", "warning");
            
            // Set content
            toastTitle.textContent = title;
            toastMessage.textContent = message;
            
            // Assign type classes
            toast.classList.add(type, "show");
            toastIcon.classList.remove("error", "success", "warning");
            toastIcon.classList.add(type);
            
            // Auto-hide after 4 seconds
            setTimeout(() => {
                toast.classList.remove("show");
            }, 4000);
        }

        function login() {
            const userId = document.getElementById("userId").value.trim();
            const loginButton = document.getElementById("loginButton");
            const userIdInput = document.getElementById("userId");
            const userIdFeedback = document.getElementById("userIdFeedback");
            
            // Clear previous feedback
            userIdInput.classList.remove("error");
            userIdFeedback.classList.remove("error");
            userIdFeedback.textContent = "";
            
            if (!userId) {
                userIdInput.classList.add("error");
                userIdFeedback.classList.add("error");
                userIdFeedback.textContent = "User ID is required";
                return;
            }
            
            // Display loading state
            loginButton.classList.add("loading");
            loginButton.disabled = true;
            
            // Simulate server validation (500ms delay)
            setTimeout(() => {
                // Examine if the user exists in the database
                const user = userDatabase.find(u => u.id === userId , u => u.name === name, u => u.email === email);
                
                if (user) {
                    // User exists - indicate success and redirect
                    showToast("success", "Success", "Login successful! You will be redirected shortly...");
                    
                    // Store user data in local storage
                    localStorage.setItem("user", JSON.stringify({ 
                        id: user.id,
                        email: user.email,
                        lastLogin: new Date().toISOString(),
                        previousLogin: user.lastLogin,
                        isActive: true
                    }));
                    
                    // Redirect after a brief delay
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2500);
                } else {
                    // User does not exist
                    loginButton.classList.remove("loading");
                    loginButton.disabled = false;
                    
                    userIdInput.classList.add("error");
                    userIdFeedback.classList.add("error");
                    userIdFeedback.textContent = "Account not found. Kindly verify your User ID or create a new account.";
                    
                    showToast("error", "Account Not Found", "No account exists under this User ID");
                }
            }, 800);
        }
        
        function showCreateAccountModal() {
            document.getElementById("createAccountModal").classList.add("show");
        }
        
        function hideCreateAccountModal() {
            document.getElementById("createAccountModal").classList.remove("show");
        }
        
        function createAccount() {
            const newUserId = document.getElementById("newUserId").value.trim();
            const email = document.getElementById("email").value.trim();
            const createButton = document.getElementById("createAccountButton");
            
            if (!newUserId || !email) {
                showToast("warning", "Incomplete Information", "Please fill in all fields");
                return;
            }
            
            // Check if user already exists
            if (userDatabase.some(u => u.id === newUserId)) {
                showToast("warning", "User ID Taken", "This User ID is already in use");
                return;
            }
            
            // Activate loading state
            createButton.classList.add("loading");
            createButton.disabled = true;
            
            // Simulate account creation delay
            setTimeout(() => {
                // Add to simulated database
                userDatabase.push({
                    id: newUserId,
                    email: email,
                    lastLogin: new Date().toISOString()
                });
                
                // Conceal modal
                hideCreateAccountModal();
                
                // Reset form
                document.getElementById("newUserId").value = "";
                document.getElementById("email").value = "";
                
                // Reset button state
                createButton.classList.remove("loading");
                createButton.disabled = false;
                
                // Display success message
                showToast("success", "Account Created", "Your account has been successfully established");
                
                // Pre-fill the login form with the new user ID
                document.getElementById("userId").value = newUserId;
            }, 1000);
        }
        
        // Allow login on Enter key press
        document.getElementById("userId").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });
